<style>
:root{--bg:#070b14;--panel:#0f1727;--ink:#eef4ff;--muted:#93a3bd;--acc:#ff8a1f;--ice:#5ad7ff;--line:#24314a;color-scheme:dark}

a:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
