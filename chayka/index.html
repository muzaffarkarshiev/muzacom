<style>
  html,body{margin:0;height:100%;background:#1a1030;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;max-width:100vw;max-height:100vh;aspect-ratio:9/16;height:100vh;border-radius:0}
  @media (min-aspect-ratio: 9/16){canvas{height:100vh;width:auto}}
  @media (max-aspect-ratio: 9/16){canvas{width:100vw;height:auto}}
</style>

<body>
<div id="wrap"><canvas id="c" width="540" height="960"></canvas></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=540,H=960,SEA=780;
let state='menu',t=0,score=0,best=0,simits=0;
try{best=+localStorage.getItem('chayka_best')||0}catch(e){}
const bird={x:150,y:400,vy:0,r:22,flap:0};
let towers=[],items=[],parts=[],floats=[],speed=3.2,spawnT=0,shake=0,lives=1,shield=0;
const G=0.42,JUMP=-8.2,GAP0=290;

// ---------- audio (simple synth, started on first tap) ----------
let ac=null;
function beep(f,d=.08,type='sine',v=.15,slide=0){
  if(!ac)return; const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=f; if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),ac.currentTime+d);
  g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
}

// ---------- background layers ----------
const stars=[...Array(60)].map(()=>({x:Math.random()*W,y:Math.random()*380,s:Math.random()*1.8+.4}));
function skyline(seed,col,base,scale,step){
  const r=mulberry(seed),pts=[];
  for(let x=0;x<1200;x+=step){pts.push({x,h:(40+r()*110)*scale,type:r()<.18?'mosque':(r()<.12?'tower':'b')})}
  return {pts,col,base,scale};
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const far=skyline(3,'#3b2550',SEA,0.8,46),near=skyline(9,'#22142f',SEA,1.15,64);
let farX=0,nearX=0,waveX=0;

function drawMosque(x,base,s,col){
  ctx.fillStyle=col;
  ctx.fillRect(x-60*s,base-45*s,120*s,45*s);
  ctx.beginPath();ctx.arc(x,base-45*s,40*s,Math.PI,0);ctx.fill();
  ctx.beginPath();ctx.arc(x-42*s,base-40*s,18*s,Math.PI,0);ctx.arc(x+42*s,base-40*s,18*s,Math.PI,0);ctx.fill();
  for(const m of[-80,80]){ctx.fillRect(x+m*s-4*s,base-150*s,8*s,150*s);ctx.beginPath();ctx.moveTo(x+m*s-5*s,base-150*s);ctx.lineTo(x+m*s,base-175*s);ctx.lineTo(x+m*s+5*s,base-150*s);ctx.fill()}
}
function drawLayer(L,off){
  for(const p of L.pts){
    let x=((p.x-off)%1200+1200)%1200-60;
    if(p.type==='mosque')drawMosque(x+30,L.base,L.scale*.8,L.col);
    else if(p.type==='tower'){ctx.fillStyle=L.col;ctx.fillRect(x+20,L.base-p.h-60,26,p.h+60);ctx.beginPath();ctx.moveTo(x+16,L.base-p.h-60);ctx.lineTo(x+33,L.base-p.h-100);ctx.lineTo(x+50,L.base-p.h-60);ctx.fill()}
    else{ctx.fillStyle=L.col;ctx.fillRect(x,L.base-p.h*.6,L.scale*58,p.h*.6)}
  }
}
function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,SEA);
  g.addColorStop(0,'#1b1240');g.addColorStop(.55,'#7a3a6e');g.addColorStop(.85,'#f08a5d');g.addColorStop(1,'#ffc26b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,SEA);
  for(const s of stars){ctx.globalAlpha=.35+.35*Math.sin(t*.05+s.x);ctx.fillStyle='#fff';ctx.fillRect(s.x,s.y,s.s,s.s)}
  ctx.globalAlpha=1;
  // sun + crescent moon
  const sg=ctx.createRadialGradient(370,640,10,370,640,200);sg.addColorStop(0,'rgba(255,230,160,.95)');sg.addColorStop(1,'rgba(255,180,100,0)');
  ctx.fillStyle=sg;ctx.fillRect(170,440,400,400);
  ctx.fillStyle='#fff6d8';ctx.beginPath();ctx.arc(440,130,26,0,7);ctx.fill();
  ctx.fillStyle='#1d1342';ctx.beginPath();ctx.arc(451,124,23,0,7);ctx.fill();
  ctx.save();ctx.textAlign='center';ctx.font='900 82px system-ui,sans-serif';
  const ny=520+Math.sin(t*.02)*6;
  ctx.shadowColor='rgba(255,90,110,.55)';ctx.shadowBlur=30;
  ctx.fillStyle='rgba(255,235,240,.16)';ctx.fillText('MUZAFFAR',W/2,ny);
  ctx.shadowBlur=0;ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.28)';ctx.strokeText('MUZAFFAR',W/2,ny);
  ctx.restore();
  drawLayer(far,farX);drawLayer(near,nearX);
  // sea
  const sea=ctx.createLinearGradient(0,SEA,0,H);sea.addColorStop(0,'#3a2a5c');sea.addColorStop(1,'#120c24');
  ctx.fillStyle=sea;ctx.fillRect(0,SEA,W,H-SEA);
  ctx.strokeStyle='rgba(255,190,120,.55)';ctx.lineWidth=3;
  for(let i=0;i<14;i++){const y=SEA+8+i*13,w=40+i*10,x=((370+Math.sin(i*1.7+t*.05)*30-w/2));ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.stroke()}
  ctx.strokeStyle='rgba(255,255,255,.12)';
  for(let i=0;i<9;i++){const y=SEA+20+i*20,x=((i*97-waveX*1.5)%W+W)%W;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+50,y);ctx.stroke()}
}

// ---------- obstacles: minarets top & bottom ----------
function spawnTower(){
  const gap=Math.max(200,GAP0-score*3.5);
  const minY=170,maxY=SEA-130-gap;
  const top=minY+Math.random()*(maxY-minY);
  towers.push({x:W+60,top,gap,w:78,passed:false,moving:score>12&&Math.random()<.35,ph:Math.random()*6});
  if(Math.random()<.7)items.push({x:W+60+39,y:top+gap/2+(Math.random()-.5)*gap*.4,type:Math.random()<.12?'shield':'simit',got:false});
}
function drawMinaret(x,y,h,w,up){
  // body
  const g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,'#e9dcc7');g.addColorStop(.5,'#fff8ec');g.addColorStop(1,'#c9b89f');
  ctx.fillStyle=g;
  if(up){ // hanging from top (upside down tower)
    ctx.fillRect(x+10,0,w-20,y-40);
    ctx.fillStyle='#d8c6aa';ctx.fillRect(x,y-70,w,14);
    ctx.fillStyle='#2f6f8f';ctx.beginPath();ctx.moveTo(x+8,y-40);ctx.lineTo(x+w/2,y);ctx.lineTo(x+w-8,y-40);ctx.fill();
    ctx.fillStyle=g;ctx.fillRect(x+8,y-56,w-16,16);
  }else{
    ctx.fillRect(x+10,y+40,w-20,h);
    ctx.fillStyle='#d8c6aa';ctx.fillRect(x,y+56,w,14);
    ctx.fillStyle='#2f6f8f';ctx.beginPath();ctx.moveTo(x+8,y+40);ctx.lineTo(x+w/2,y);ctx.lineTo(x+w-8,y+40);ctx.fill();
    ctx.fillStyle='#e8c35a';ctx.fillRect(x+w/2-2,y-18,4,20);
    ctx.beginPath();ctx.arc(x+w/2,y-22,5,0,7);ctx.fill();
  }
  ctx.fillStyle='rgba(0,0,0,.12)';
  for(let k=0;k<6;k++){const yy=up?y-110-k*70:y+110+k*70;ctx.fillRect(x+w/2-6,yy,12,22)}
}
function drawSimit(x,y,s=1){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='#b86a2c';ctx.beginPath();ctx.arc(0,0,17,0,7);ctx.fill();
  ctx.fillStyle='#d8893e';ctx.beginPath();ctx.arc(-2,-2,15,0,7);ctx.fill();
  ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(0,0,7,0,7);ctx.fill();ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#fff3d6';for(let a=0;a<12;a++){const r=11,ang=a*.52+.3;ctx.fillRect(Math.cos(ang)*r-1,Math.sin(ang)*r-1,2.4,2.4)}
  ctx.restore();
}
function drawShield(x,y){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(120,220,255,.25)';ctx.beginPath();ctx.arc(0,0,22,0,7);ctx.fill();
  ctx.fillStyle='#d11';ctx.beginPath();ctx.arc(0,0,15,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-2,0,9,0,7);ctx.fill();ctx.fillStyle='#d11';ctx.beginPath();ctx.arc(1,0,7.5,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(8,0,2.6,0,7);ctx.fill();
  ctx.restore();
}

// ---------- seagull ----------
function drawBird(){
  const b=bird;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.max(-.5,Math.min(.9,b.vy*.06)));
  if(shield>0){ctx.strokeStyle=`rgba(120,220,255,${.5+.3*Math.sin(t*.3)})`;ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,34,0,7);ctx.stroke()}
  const wing=Math.sin(b.flap)*14;
  ctx.fillStyle='#cfd6de';
  ctx.beginPath();ctx.moveTo(-6,-2);ctx.quadraticCurveTo(-14,-20-wing,-34,-14-wing);ctx.quadraticCurveTo(-18,-4,-6,4);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,2,24,14,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(18,-6,10,0,7);ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(21,-8,2.2,0,7);ctx.fill();
  ctx.fillStyle='#f4b42a';ctx.beginPath();ctx.moveTo(26,-5);ctx.lineTo(40,-2);ctx.lineTo(26,1);ctx.fill();
  ctx.fillStyle='#e04a2a';ctx.fillRect(33,-3,3,3);
  ctx.fillStyle='#9aa4ae';ctx.beginPath();ctx.moveTo(-22,0);ctx.lineTo(-34,-4);ctx.lineTo(-32,8);ctx.fill();
  ctx.fillStyle='#e6ebf0';
  ctx.beginPath();ctx.moveTo(2,0);ctx.quadraticCurveTo(-2,-26+wing,-26,-30+wing*1.4);ctx.quadraticCurveTo(-8,-10,2,6);ctx.fill();
  ctx.fillStyle='#38414b';ctx.beginPath();ctx.moveTo(-26,-30+wing*1.4);ctx.lineTo(-18,-24+wing);ctx.lineTo(-20,-30+wing*1.3);ctx.fill();
  ctx.restore();
}

// ---------- fx ----------
function burst(x,y,col,n=14){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.8)*7,l:30+Math.random()*20,col})}
function pop(x,y,txt,col='#ffe08a'){floats.push({x,y,txt,col,l:50})}

// ---------- game flow ----------
function reset(){bird.y=400;bird.vy=0;towers=[];items=[];parts=[];floats=[];score=0;simits=0;speed=3.2;spawnT=0;shield=0;t=0}
function flap(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(state==='menu'||state==='over'){if(state==='over'&&overT<25)return;reset();state='play'}
  bird.vy=JUMP;beep(620,.09,'triangle',.12,200);
}
let overT=0;
function die(){
  if(shield>0){shield=0;shake=10;beep(200,.2,'square',.12,-100);burst(bird.x,bird.y,'#7fd8ff',20);bird.vy=JUMP*.8;return false}
  state='over';overT=0;shake=18;beep(160,.4,'sawtooth',.15,-120);burst(bird.x,bird.y,'#fff',26);
  if(score>best){best=score;try{localStorage.setItem('chayka_best',best)}catch(e){}}
  return true;
}
function update(){
  t++;
  const sp=state==='play'?speed:1.2;
  farX+=sp*.25;nearX+=sp*.55;waveX+=sp;
  bird.flap+=state==='play'?.45:.25;
  if(state==='menu'){bird.y=400+Math.sin(t*.06)*20;return}
  if(state==='over'){overT++;if(bird.y<SEA-10){bird.vy+=G;bird.y+=bird.vy}}
  if(state!=='play')return;
  bird.vy=Math.min(bird.vy+G,11);bird.y+=bird.vy;
  if(shield>0)shield--;
  speed=3.2+Math.min(score*.06,3.3);
  spawnT-=speed;if(spawnT<=0){spawnTower();spawnT=290}
  for(const tw of towers){
    tw.x-=speed;
    if(tw.moving)tw.top+=Math.sin(t*.04+tw.ph)*1.2;
    if(!tw.passed&&tw.x+tw.w<bird.x){tw.passed=true;score++;beep(880,.07,'sine',.1);if(score%10===0){pop(W/2,300,score+' ✦','#9cf');beep(1200,.15,'triangle',.1,300)}}
    const bx=bird.x,by=bird.y,r=bird.r-4;
    if(bx+r>tw.x+6&&bx-r<tw.x+tw.w-6){
      if(by-r<tw.top||by+r>tw.top+tw.gap){if(die())return;tw.passed=true;tw.x=-999}
    }
  }
  towers=towers.filter(tw=>tw.x>-120);
  for(const it of items){
    it.x-=speed;
    if(!it.got&&Math.hypot(it.x-bird.x,it.y-bird.y)<36){
      it.got=true;
      if(it.type==='simit'){simits++;score+=2;pop(it.x,it.y,'+2 simit');burst(it.x,it.y,'#e9a24d');beep(1040,.08,'square',.06,400)}
      else{shield=60*6;pop(it.x,it.y,'Himoya!','#9be7ff');burst(it.x,it.y,'#9be7ff');beep(500,.25,'triangle',.12,700)}
    }
  }
  items=items.filter(i=>i.x>-40&&!i.got);
  if(bird.y>SEA-14||bird.y<-40){if(die())return;bird.y=Math.min(bird.y,SEA-60);}
}
function drawUI(){
  ctx.textAlign='center';
  if(state==='play'||state==='over'){
    ctx.font='900 76px system-ui,sans-serif';ctx.lineWidth=10;ctx.strokeStyle='rgba(20,10,40,.6)';
    ctx.strokeText(score,W/2,120);ctx.fillStyle='#fff';ctx.fillText(score,W/2,120);
    drawSimit(42,46,.9);ctx.font='800 28px system-ui';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.fillText('× '+simits,66,56);
    ctx.textAlign='center';
  }
  if(state==='menu'){
    panel(70,180,400,330);
    ctx.fillStyle='#e2132a';ctx.font='900 50px system-ui';ctx.fillText('CHAYKA',W/2,262);
    ctx.fillStyle='#3a2a5c';ctx.font='700 26px system-ui';ctx.fillText('Istanbul osmonida',W/2,300);
    ctx.font='500 21px system-ui';ctx.fillStyle='#555';
    ctx.fillText('Bosing — chayka yuqoriga uchadi',W/2,352);
    ctx.fillText('Minoralarga tegmang',W/2,384);
    drawSimit(W/2-110,422,.8);ctx.fillText('simit = +2 ochko',W/2+10,430);
    drawShield(W/2-110,462);ctx.fillText('bayroq = himoya',W/2+10,470);
    if(best){ctx.fillStyle='#e2132a';ctx.font='800 22px system-ui';ctx.fillText('Rekord: '+best,W/2,500)}
    btn('BOSHLASH',600);
  }
  if(state==='over'&&overT>20){
    panel(80,220,380,300);
    ctx.fillStyle='#e2132a';ctx.font='900 46px system-ui';ctx.fillText("O'YIN TUGADI",W/2,292);
    ctx.fillStyle='#333';ctx.font='700 30px system-ui';ctx.fillText('Ochko: '+score,W/2,350);
    ctx.fillText('Simit: '+simits,W/2,392);
    ctx.fillStyle=score>=best&&score>0?'#e2132a':'#666';ctx.font='800 26px system-ui';
    ctx.fillText(score>=best&&score>0?'🏆 Yangi rekord!':'Rekord: '+best,W/2,446);
    ctx.fillStyle='#777';ctx.font='500 20px system-ui';ctx.fillText(medal(score),W/2,488);
    if(overT>25)btn('QAYTA',580);
  }
}
function medal(s){return s>=50?'Bosfor afsonasi 🥇':s>=25?'Usta chayka 🥈':s>=10?'Yaxshi parvoz 🥉':'Yana urinib ko‘ring!'}
function panel(x,y,w,h){ctx.fillStyle='rgba(0,0,0,.25)';rr(x+6,y+10,w,h,28);ctx.fill();ctx.fillStyle='#fffaf2';rr(x,y,w,h,28);ctx.fill();ctx.strokeStyle='#e2132a';ctx.lineWidth=5;rr(x,y,w,h,28);ctx.stroke()}
function btn(txt,y){const p=1+.04*Math.sin(t*.12);ctx.save();ctx.translate(W/2,y);ctx.scale(p,p);ctx.fillStyle='#b20d20';rr(-130,-34+6,260,72,36);ctx.fill();ctx.fillStyle='#e2132a';rr(-130,-34,260,72,36);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 32px system-ui';ctx.textAlign='center';ctx.fillText(txt,0,12);ctx.restore()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function frame(){
  update();
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85;if(shake<.5)shake=0}
  drawBg();
  for(const tw of towers){drawMinaret(tw.x,tw.top,tw.top,tw.w,true);drawMinaret(tw.x,tw.top+tw.gap,SEA-tw.top-tw.gap,tw.w,false)}
  for(const it of items){const by=Math.sin(t*.1+it.x*.05)*5;it.type==='simit'?drawSimit(it.x,it.y+by,1.1+.05*Math.sin(t*.2)):drawShield(it.x,it.y+by)}
  drawBird();
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.l--;ctx.globalAlpha=Math.max(0,p.l/40);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,5,5)}
  parts=parts.filter(p=>p.l>0);ctx.globalAlpha=1;
  for(const f of floats){f.y-=1.2;f.l--;ctx.globalAlpha=Math.max(0,f.l/50);ctx.fillStyle=f.col;ctx.font='900 30px system-ui';ctx.textAlign='center';ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=5;ctx.strokeText(f.txt,f.x,f.y);ctx.fillText(f.txt,f.x,f.y)}
  floats=floats.filter(f=>f.l>0);ctx.globalAlpha=1;
  drawUI();
  ctx.restore();
  requestAnimationFrame(frame);
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}});
requestAnimationFrame(frame);
</script>
<script data-goatcounter="https://muzacom.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
