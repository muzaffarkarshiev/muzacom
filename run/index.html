<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a0f2e">
<title>Muzaffar Run</title>
<meta property="og:title" content="Muzaffar Run — Istanbul ko'chalarida yugur!">
<style>
html,body{margin:0;height:100%;background:#120a22;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(18,10,34,.35),rgba(18,10,34,.85))}
#ov.hide{display:none}
.card{width:min(360px,88vw);text-align:center;color:#fff}
.face{width:112px;height:140px;border-radius:50%;object-fit:cover;border:4px solid #ffb21f;box-shadow:0 0 0 6px rgba(255,178,31,.25),0 18px 40px rgba(0,0,0,.5);display:block;margin:0 auto 10px}
h1{margin:0;font:900 italic 40px/1 system-ui,sans-serif;letter-spacing:.02em;text-shadow:0 4px 0 #7a2a00,0 8px 24px rgba(0,0,0,.5)}
h1 b{color:#ffb21f}
.sub{color:#ffd9a8;font-size:14px;margin:8px 0 14px}
.best{display:inline-block;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);padding:6px 14px;border-radius:20px;font-weight:700;font-size:14px;margin-bottom:14px}
button{font:900 20px system-ui,sans-serif;border:0;border-radius:16px;padding:16px;width:100%;cursor:pointer;background:linear-gradient(180deg,#ffcf3d,#ff9a1f);color:#3a1600;box-shadow:0 6px 0 #b85a00,0 12px 24px rgba(0,0,0,.35)}
button:active{transform:translateY(3px);box-shadow:0 3px 0 #b85a00}
.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;font-size:15px;padding:12px;margin-top:10px}
.help{font-size:13px;color:#e6d6ff;line-height:1.6;margin-top:14px;background:rgba(0,0,0,.28);border-radius:14px;padding:10px 12px;text-align:left}
.help b{color:#ffcf3d}
.big{font:900 54px/1 system-ui;margin:6px 0;color:#ffcf3d;text-shadow:0 4px 0 #7a2a00}
.row{display:flex;gap:10px;justify-content:center;margin:8px 0 14px;font-weight:800}
.row span{background:rgba(0,0,0,.35);padding:8px 12px;border-radius:12px}
a.back{display:inline-block;margin-top:12px;color:#d9c8ff;font-size:13px;text-decoration:none}
</style>
</head>

/* ---------- audio ---------- */
let AC=null,musicOn=true,musicT=0,beat=0;
function audioInit(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();else if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,d,type,v,slide,t0){if(!AC)return;const t=t0||AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v,fr,t0){if(!AC)return;const t=t0||AC.currentTime,n=Math.max(1,AC.sampleRate*d|0),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(rnd()*2-1)*(1-i/n);const s=AC.createBufferSource(),gn=AC.createGain(),f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=fr||1000;s.buffer=b;gn.gain.value=v;s.connect(f).connect(gn).connect(AC.destination);s.start(t)}
const sfx={
  coin(){tone(1320,.08,'square',.05);tone(1980,.12,'square',.04,0,AC&&AC.currentTime+.06)},
  jump(){tone(300,.18,'triangle',.12,700)},
  slide(){noise(.25,.12,600)},
  lane(){noise(.08,.05,2500)},
  power(){[660,880,1100,1320].forEach((f,i)=>tone(f,.12,'square',.05,0,AC&&AC.currentTime+i*.07))},
  hit(){tone(120,.4,'sawtooth',.2,40);noise(.3,.25,200)},
  bump(){tone(180,.15,'square',.12,90)}
};
const BASS=[55,55,65.4,49];
function music(){
  if(!AC||!musicOn||S.mode!=='play')return;
  const spb=60/(118+Math.min(30,S.speed/8));
  while(musicT<AC.currentTime+.25){
    if(musicT<AC.currentTime)musicT=AC.currentTime+.02;
    const b=beat%16;
    if(b%4===0)tone(110,.18,'sine',.32,40,musicT);
    if(b%4===2)noise(.05,.05,6000,musicT);
    if(b%8===4)noise(.12,.09,1500,musicT);
    if(b%2===0)tone(BASS[(beat>>4)%4]*(b%8<4?1:1.5),spb*.9,'sawtooth',.045,0,musicT);
    if(b===0||b===6||b===10)tone(BASS[(beat>>4)%4]*4,spb*.6,'triangle',.03,0,musicT);
    musicT+=spb/2;beat++;
  }
}

/* ---------- physics ---------- */
function laneOf(x){return Math.round(x/LW)}
function groundAt(lane,z){let h=0;

    if(o.type==='tram'&&z>=o.z0-1&&z<=o.z0+o.len)h=Math.max(h,TRAM_H);
    else if(o.type==='ramp'&&z>=o.z0&&z<=o.z0+o.len)h=Math.max(h,(z-o.z0)/o.len*TRAM_H)}

  if(o.lane!==laneOf(P.x)||Math.abs(P.x-o.lane*LW)>LW*.5)return;

  if(o.type==='barrier'&&P.y<11)crash();
  else if(o.type==='bar'&&!(P.y>25)&&h>15)crash();

function step(dt){

  if(P.crash){S.over-=1;P.crash+=dt;if(S.over<=0)gameOver();return}
  S.t+=dt;
  S.speed=Math.min(165,S.speed+dt*(S.speed<110?2.2:.9));
  const dz=S.speed*dt;S.D+=dz;
  S.score+=dz*.1*S.mult*(S.pow.x2>0?2:1);
  for(const k in S.pow)if(S.pow[k]>0)S.pow[k]=Math.max(0,S.pow[k]-dt);
  // player
  P.x=lerp(P.x,P.lane*LW,1-Math.exp(-dt*16));
  P.lean=lerp(P.lean,(P.lane*LW-P.x)*.05,.3);
  const gnd=groundAt(laneOf(P.x),S.D);
  P.vy-=GRAV*dt;P.y+=P.vy*dt;
  if(P.y<=gnd){if(!P.onGround&&P.vy<-150){dust(P.x,S.D,6)}P.y=gnd;P.vy=0;P.onGround=true}else if(P.y>gnd+1)P.onGround=false;

    if(mag&&c.z-S.D<140&&c.z>S.D-5){c.x=lerp(c.x,P.x,.18);c.y=lerp(c.y,P.y+10,.18);c.z=lerp(c.z,S.D,.12)}

  for(let i=BUILD.length-1;i>=0;i--)if(BUILD[i].z1<S.D-150)BUILD.splice(i,1);
  while(LAMPS.length&&LAMPS[0]<S.D-150)LAMPS.shift();

}

  const run=P.onGround&&!P.crash?1:0,ph=P.ph,s=Math.sin(ph)*run;
  const sliding=P.slide>0&&P.onGround,air=!P.onGround;
  if(sliding){
    // crouch roll pose
    g.rotate(-.12);
    g.fillStyle=JEANS;g.beginPath();g.ellipse(0,-5,7,4.5,0,0,7);g.fill();
    g.fillStyle=SHOE;g.fillRect(-7,-2.4,4,2.4);g.fillRect(3,-2.4,4,2.4);
    g.fillStyle=SHIRT;g.beginPath();g.ellipse(0,-10,6.5,5.5,0,0,7);g.fill();
    g.strokeStyle=STRAP;g.lineWidth=1.1;g.beginPath();g.moveTo(-5,-13);g.lineTo(5,-7);g.stroke();
    g.fillStyle=HAIR;g.beginPath();g.arc(0,-15.5,3.3,0,7);g.fill();
    g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=.6;for(let i=0;i<3;i++){g.beginPath();g.moveTo(-9-i*2,-12+i*3);g.lineTo(-14-i*2,-12+i*3);g.stroke()}
    g.restore();return;
  }
  const hipY=-12,shY=-21.5,tuck=air?Math.min(1,Math.max(0,P.vy/120+.4)):0;
  // legs (from behind): alternate lift
  for(const L of [-1,1]){
    const lift=air?4+tuck*3:Math.max(0,Math.sin(ph+(L>0?0:Math.PI)))*4.5*run;
    const fwd=air?(L>0?1:-1)*1.5:Math.cos(ph+(L>0?0:Math.PI))*run;
    const hx=L*2.1,fx=L*2.4,fy=-lift+(air?-tuck*2:0)-(fwd>0?fwd*1.2:0);
    const kx=L*2.5+(air?L*.6:0),ky=(hipY+fy)/2-(air?tuck*3:lift*.4);
    seg(hx,hipY,kx,ky,3.4,JEANS);seg(kx,ky,fx,fy-1.2,3,JEANS);seg(hx+L*.6,hipY+.5,kx+L*.7,ky,.7,'rgba(140,160,200,.35)');seg(kx+L*.6,ky,fx+L*.6,fy-1.5,.6,'rgba(140,160,200,.3)');
    g.fillStyle=SHOE;g.beginPath();g.ellipse(fx,fy-.6,1.9,1.4,0,0,7);g.fill();g.fillStyle='#bbb';g.fillRect(fx-1.9,fy-.2,3.8,.7);
  }
  // torso (t-shirt)
  const sw=Math.sin(ph)*run*.6;
  g.fillStyle=SHIRT;g.beginPath();g.moveTo(-3.6,hipY+.6);g.lineTo(3.6,hipY+.6);g.lineTo(4.9+sw*.2,shY+1.2);g.quadraticCurveTo(4.6,shY-.6,3,shY-.8);g.lineTo(-3,shY-.8);g.quadraticCurveTo(-4.6,shY-.6,-4.9+sw*.2,shY+1.2);g.closePath();g.fill();
  const tg=g.createLinearGradient(-5,0,5,0);tg.addColorStop(0,'rgba(255,255,255,.1)');tg.addColorStop(.5,'rgba(255,255,255,.03)');tg.addColorStop(1,'rgba(0,0,0,.25)');g.fillStyle=tg;g.fill();
  // folds
  g.strokeStyle='rgba(255,255,255,.07)';g.lineWidth=.4;g.beginPath();g.moveTo(-2,hipY-1);g.quadraticCurveTo(0,hipY-3+sw,2,hipY-1.5);g.stroke();
  // jeans waist
  g.fillStyle=JEANS;g.fillRect(-3.7,hipY-.2,7.4,2.2);g.fillStyle='#6b4a2c';g.fillRect(-3.7,hipY-.4,7.4,.6);
  if(!front){
    // crossbody bag strap (diagonal on back) + bag at hip
    g.strokeStyle=STRAP;g.lineWidth=1.2;g.beginPath();g.moveTo(-3.6,shY+.4);g.lineTo(3.2,hipY-1.2);g.stroke();
    g.fillStyle='#2a2018';g.beginPath();g.ellipse(3.6,hipY-1,2.3,1.6,.3,0,7);g.fill();
  }
  // arms
  for(const L of [-1,1]){
    const a=air?-1:-Math.sin(ph+(L>0?0:Math.PI))*run;
    const sx=L*4.6,sy=shY+1;
    const ex=L*5.6,ey=sy+4.2-a*1.2,hx=L*(5+(air?1.5:0)),hy=air?sy-1-tuck*2:sy+8-a*3.2;
    seg(sx,sy,ex,ey,2.4,SHIRT);seg(ex,ey,hx,hy,1.9,SKIN);g.fillStyle=SKIN;g.beginPath();g.arc(hx,hy,1.05,0,7);g.fill();
  }
  // neck + head
  seg(0,shY,0,shY-1.6,1.9,SKIN);
  const hy=shY-4.1;
  if(front&&faceImg.complete){
    g.save();g.beginPath();g.ellipse(0,hy,2.9,3.6,0,0,7);g.clip();g.drawImage(faceImg,-3.4,hy-4.3,6.8,8.5);g.restore();
    g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=.25;g.beginPath();g.ellipse(0,hy,2.9,3.6,0,0,7);g.stroke();
    g.strokeStyle=STRAP;g.lineWidth=1.2;g.beginPath();g.moveTo(3.6,shY+.4);g.lineTo(-3.2,hipY-1.2);g.stroke();
  }else{
    g.fillStyle=SKIN;g.beginPath();g.ellipse(-2.8,hy+.4,.7,1.1,0,0,7);g.ellipse(2.8,hy+.4,.7,1.1,0,0,7);g.fill();
    g.fillStyle=HAIR;g.beginPath();g.ellipse(0,hy-.1,2.85,3.3,0,0,7);g.fill();
    g.fillStyle=SKIN;g.fillRect(-1.8,hy+2.2,3.6,1.2);
    g.fillStyle='rgba(255,255,255,.1)';g.beginPath();g.ellipse(-.8,hy-1.6,1.1,.7,-.4,0,7);g.fill();
  }
  if(!front){g.strokeStyle='rgba(255,170,90,.55)';g.lineWidth=.55;g.beginPath();g.moveTo(4.9,shY+1.4);g.lineTo(3.7,hipY+.4);g.stroke();g.beginPath();g.arc(0,shY-4.2,2.85,-1.2,.6);g.stroke();
    g.strokeStyle='rgba(20,10,5,.5)';g.lineWidth=.25;for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(i*.9,shY-7);g.quadraticCurveTo(i*1.1,shY-5,i*1.2,shY-2.2);g.stroke()}}
  g.restore();
  if(S.mode==='play'&&P.onGround&&!P.crash&&S.anim%5===0)dust(P.x+(rnd()-.5)*4,S.D-2,1);
  // speed lines / magnet aura
  if(S.pow.magnet>0){g.strokeStyle=`rgba(255,80,80,${.35+.2*Math.sin(S.anim*.3)})`;g.lineWidth=2;g.beginPath();g.ellipse(p[0],p[1]-13*k,14*k,16*k,0,0,7);g.stroke()}
  if(S.pow.boots>0){g.fillStyle='rgba(90,180,255,.5)';g.beginPath();g.ellipse(p[0],p[1],8*k,2.5*k,0,0,7);g.fill()}
}
function drawParticles(){for(const q of PART){if(q.z<ZN())continue;const p=pj(q.x,q.y,q.z);g.globalAlpha=clamp(q.l*2.5,0,1);g.fillStyle=q.c;const r=Math.min(6,q.s*p[2]*.5);g.beginPath();g.arc(p[0],p[1],r,0,7);g.fill()}g.globalAlpha=1}
function speedLines(){const a=clamp((S.speed-110)/60,0,.5);if(a<=0||S.mode!=='play')return;g.strokeStyle=`rgba(255,255,255,${a*.5})`;g.lineWidth=1.5;
  for(let i=0;i<14;i++){const ang=(i*137.5+S.anim*7)%360*Math.PI/180,r0=Math.min(vw,vh)*(.35+((i*53+S.anim*9)%100)/300),r1=r0+40;g.beginPath();g.moveTo(vw/2+Math.cos(ang)*r0,vh*.45+Math.sin(ang)*r0);g.lineTo(vw/2+Math.cos(ang)*r1,vh*.45+Math.sin(ang)*r1);g.stroke()}}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function hud(){
  const s=clamp(Math.min(vw,vh)/400,.85,1.3);
  // pause & music
  for(const x of [vw-54,12]){const hg=g.createLinearGradient(0,12,0,54);hg.addColorStop(0,'rgba(255,255,255,.22)');hg.addColorStop(1,'rgba(20,10,40,.45)');g.fillStyle=hg;rr(x,12,42,42,12);g.fill();g.strokeStyle='rgba(255,255,255,.3)';g.lineWidth=1;g.stroke()}
  g.fillStyle='#fff';g.fillRect(vw-40,23,5,20);g.fillRect(vw-31,23,5,20);
  g.font='20px system-ui,"Segoe UI Emoji"';g.textAlign='center';g.textBaseline='middle';g.fillText(musicOn?'🔊':'🔇',33,34);
  // score
  g.textAlign='right';g.font=`900 italic ${Math.round(30*s)}px system-ui`;g.lineWidth=5;g.strokeStyle='rgba(0,0,0,.45)';
  const sc=String(Math.floor(S.score)).padStart(6,'0');g.strokeText(sc,vw-66,34);{const sg=g.createLinearGradient(0,18,0,48);sg.addColorStop(0,'#ffffff');sg.addColorStop(1,'#ffd27a');g.fillStyle=sg}g.fillText(sc,vw-66,34);
  // coins
  g.textAlign='left';const cy=70*s;g.fillStyle='rgba(0,0,0,.35)';rr(vw-66-110*s,cy-14*s,110*s,28*s,14*s);g.fill();
  g.fillStyle='#ffd23d';g.beginPath();g.arc(vw-66-96*s,cy,9*s,0,7);g.fill();g.fillStyle='#b8860b';g.font=`900 ${11*s}px system-ui`;g.textAlign='center';g.fillText('M',vw-66-96*s,cy+.5);
  g.fillStyle='#fff';g.font=`900 ${17*s}px system-ui`;g.textAlign='right';g.fillText(S.coins,vw-76,cy+1);
  // face badge
  if(faceImg.complete){const r=19*s,x=64+r,y=33;g.save();g.beginPath();g.arc(x,y,r,0,7);g.clip();g.drawImage(faceImg,x-r,y-r*1.25,2*r,2.5*r);g.restore();g.strokeStyle='#ffb21f';g.lineWidth=3;g.beginPath();g.arc(x,y,r,0,7);g.stroke();
    g.fillStyle='#fff';g.font=`800 ${12*s}px system-ui`;g.textAlign='left';g.fillText(Math.floor(S.D/10)+' m',x+r+8,y)}
  // powerups
  let py=110*s;
  for(const k of ['magnet','x2','boots'])if(S.pow[k]>0){const max=k==='x2'?15:11;g.fillStyle='rgba(0,0,0,.4)';rr(vw-150*s,py,138*s,26*s,13*s);g.fill();
    g.fillStyle=PUC[k][0];g.beginPath();g.arc(vw-136*s,py+13*s,10*s,0,7);g.fill();g.fillStyle='#fff';g.font=`900 ${11*s}px system-ui,"Segoe UI Emoji"`;g.textAlign='center';g.fillText(PUC[k][1],vw-136*s,py+13.5*s);
    g.fillStyle='rgba(255,255,255,.25)';rr(vw-120*s,py+9*s,100*s,8*s,4*s);g.fill();g.fillStyle=PUC[k][0];rr(vw-120*s,py+9*s,100*s*S.pow[k]/max,8*s,4*s);g.fill();py+=32*s}
  // floating messages
  for(const f of FLOAT){const a=Math.min(1,f.l/15);g.globalAlpha=a;g.font=`900 italic ${Math.round(28*s)}px system-ui`;g.textAlign='center';g.lineWidth=6;g.strokeStyle='rgba(60,20,0,.7)';const y=vh*.3-(70-f.l)*.6;g.strokeText(f.t,vw/2,y);g.fillStyle='#ffcf3d';g.fillText(f.t,vw/2,y);g.globalAlpha=1}
  if(S.intro>0){const n=Math.ceil(S.intro*1.5-.5);g.font=`900 italic ${Math.round(90*s)}px system-ui`;g.textAlign='center';g.lineWidth=8;g.strokeStyle='rgba(60,20,0,.7)';const t=n>0?String(n):'YUGUR!';g.strokeText(t,vw/2,vh*.32);g.fillStyle='#ffcf3d';g.fillText(t,vw/2,vh*.32)}
}
function draw(){
  g.setTransform(dpr,0,0,dpr,0,0);
  if(!S)return;
  setCam();
  const hz=drawSky();drawRoad(hz);groundShadows();
  // collect drawables
  const L=[];
  for(const b of BUILD)L.push([b.z0+.01,()=>drawBuilding(b)]);
  for(const z of LAMPS){L.push([z,()=>drawLamp(z,0)]);L.push([z+.5,()=>drawLamp(z+55,1)]);if(Math.round(z/110)%3===0)L.push([z+.2,()=>drawBunting(z)])}
  for(const o of OB){let key=o.z0;if(o.type==='tram'&&o.z0<S.D&&o.z0+o.len>S.D)key=S.D+1;if(o.type==='ramp'&&o.z0<S.D&&o.z0+o.len>S.D)key=S.D+1;L.push([key,()=>drawOb(o)])}
  for(const c of COINS)L.push([c.z,()=>drawCoin(c)]);
  for(const u of PU)L.push([u.z,()=>drawPU(u)]);
  const front=S.mode==='menu'||(S.mode==='play'&&S.intro>.9)||S.mode==='over';
  L.push([S.D,()=>drawRunner(front)]);
  L.sort((a,b)=>b[0]-a[0]);
  drawWires();
  for(const[,fn]of L)fn();
  drawParticles();speedLines();
  {const sx=vw*.5-CAM.x*.3,sy=hz-vh*.06;g.save();g.globalCompositeOperation='lighter';
   for(let i=0;i<9;i++){const a=-Math.PI/2+(i-4)*.32+Math.sin(S.anim*.004+i)*.05,w=.06+.04*Math.sin(i*3.1),L2=Math.max(vw,vh)*1.2;
     g.fillStyle=`rgba(255,190,120,${.035+.02*Math.sin(S.anim*.01+i*2)})`;g.beginPath();g.moveTo(sx,sy);g.lineTo(sx+Math.cos(a-w)*L2,sy-Math.sin(a-w)*L2*-1);g.lineTo(sx+Math.cos(a+w)*L2,sy-Math.sin(a+w)*L2*-1);g.closePath();g.fill()}
   const dx=vw/2-sx,dy=vh*.55-sy;for(const[t,r,c]of[[.5,18,'rgba(255,160,120,.10)'],[.8,30,'rgba(120,180,255,.07)'],[1.2,12,'rgba(255,220,150,.12)']]){g.fillStyle=c;g.beginPath();g.arc(sx+dx*t,sy+dy*t,r,0,7);g.fill()}
   g.restore();}
  {const cg=g.createLinearGradient(0,0,0,vh);cg.addColorStop(0,'rgba(90,60,160,.18)');cg.addColorStop(.5,'rgba(255,150,90,.12)');cg.addColorStop(1,'rgba(60,20,80,.14)');g.globalCompositeOperation='soft-light';g.fillStyle=cg;g.fillRect(0,0,vw,vh);g.globalCompositeOperation='source-over'}
  const vg=g.createRadialGradient(vw/2,vh/2,Math.min(vw,vh)*.4,vw/2,vh/2,Math.max(vw,vh)*.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(30,0,40,.45)');g.fillStyle=vg;g.fillRect(0,0,vw,vh);
  if(S.flash>0){g.fillStyle=`rgba(255,255,255,${S.flash*.6})`;g.fillRect(0,0,vw,vh)}
  if(S.mode==='play')hud();
}

/* ---------- flow ---------- */
function start(){audioInit();reset();S.mode='play';S.intro=1.6;ov.className='hide';if(AC)musicT=AC.currentTime+.1}
function togglePause(){if(!S)return;if(S.mode==='play'){S.mode='pause';showPause()}else if(S.mode==='pause'){S.mode='play';ov.className='hide';if(AC)musicT=AC.currentTime+.05}}
function showPause(){ov.className='';ov.innerHTML=`<div class="card"><h1>PAUZA</h1><p class="sub">${Math.floor(S.score)} ochko · ${S.coins} tanga</p><button id="go">▶ Davom etish</button><button class="ghost" id="mn">Menyu</button></div>`;
  document.getElementById('go').onclick=togglePause;document.getElementById('mn').onclick=menu}
function gameOver(){
  S.mode='over';const sc=Math.floor(S.score),nb=sc>best;if(nb){best=sc;try{localStorage.setItem('mzrun_best',best)}catch(e){}}
  ov.className='';ov.innerHTML=`<div class="card"><img class="face" src="${FACE}" alt=""><h1>${nb?'YANGI <b>REKORD!</b>':'URILDINGIZ!'}</h1>
  <div class="big">${sc}</div><div class="row"><span>🪙 ${S.coins}</span><span>📏 ${Math.floor(S.D/10)} m</span><span>🏆 ${best}</span></div>
  <button id="go">↻ Qayta yugurish</button><button class="ghost" id="mn">Menyu</button><a class="back" href="../bio/">← Muzaffar sahifasi</a></div>`;
  document.getElementById('go').onclick=start;document.getElementById('mn').onclick=menu;
}
function menu(){
  reset();S.mode='menu';ov.className='';
  ov.innerHTML=`<div class="card"><img class="face" src="${FACE}" alt="Muzaffar"><h1>MUZAFFAR <b>RUN</b></h1>
  <p class="sub">Istanbul ko‘chalarida yugur, tanga yig‘, tramvaylardan qoch!</p>
  ${best?`<div class="best">🏆 Rekord: ${best}</div>`:''}
  <button id="go">▶ YUGURISH</button>
  <div class="help"><b>Telefon:</b> barmoq bilan suring — ⬅️ ➡️ yo‘lak almashtirish, ⬆️ sakrash, ⬇️ egilib o‘tish.<br><b>Kompyuter:</b> strelkalar yoki WASD, Probel — sakrash, P — pauza.<br>🧲 magnit · ×2 ochko · 👟 baland sakrash</div>
  <a class="back" href="../bio/">← Muzaffar sahifasi</a></div>`;
  document.getElementById('go').onclick=start;
}
let lt=performance.now();
function frame(now){const dt=Math.min(.05,(now-lt)/1000);lt=now;
  if(S&&S.mode==='menu'){S.D+=dt*25;S.anim++;P.ph+=dt*3;for(const s of [0,1])while(S.bZ[s]<S.D+1400)genBuilding(s);while(LAMPS[LAMPS.length-1]<S.D+1400)LAMPS.push(LAMPS[LAMPS.length-1]+110);OB=OB.filter(o=>o.z0>S.D+60);COINS=COINS.filter(c=>c.z>S.D+60)}
  else if(S)step(dt);
  draw();requestAnimationFrame(frame)}
menu();requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&S.mode==='play')togglePause()});
</script>
